name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed version tag to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Verify release tag
        run: |
          package_version="$(node -p "require('./package.json').version")"
          manifest_version="$(node -p "require('./manifest.json').version")"
          expected_tag="v${package_version}"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "::error::Release tag ${RELEASE_TAG} does not match package version ${package_version}"
            exit 1
          fi
          if [ "$manifest_version" != "$package_version" ]; then
            echo "::error::Manifest version ${manifest_version} does not match package version ${package_version}"
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Release tag ${RELEASE_TAG} is not on main"
            exit 1
          fi
      - run: npm ci
      - name: Install Chrome for Testing
        run: npx playwright-core install --with-deps --no-shell chromium
      - run: npm run release:check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 1

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: dist
      - name: Create GitHub Release
        run: |
          asset_name="persistent-clicker-${RELEASE_TAG#v}.zip"
          asset_path="dist/${asset_name}"
          if release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets,isDraft,isPrerelease,url 2>/dev/null)"; then
            if [ "$(printf '%s' "$release_json" | jq -r '.isDraft or .isPrerelease')" = true ]; then
              echo "::error::Release already exists but is not a final release"
              exit 1
            fi
            if ! printf '%s' "$release_json" | jq -e --arg name "$asset_name" '.assets | any(.name == $name)' >/dev/null; then
              echo "::error::Published release is missing ${asset_name}"
              exit 1
            fi
            existing_dir="$(mktemp -d)"
            trap 'rm -rf "$existing_dir"' EXIT
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset_name" --dir "$existing_dir"
            if ! cmp "$asset_path" "$existing_dir/$asset_name"; then
              echo "::error::Published release contains different bytes for ${asset_name}"
              exit 1
            fi
            echo "Release already exists with the verified artifact: $(printf '%s' "$release_json" | jq -r '.url')"
            exit 0
          fi
          gh release create "$RELEASE_TAG" "$asset_path" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Persistent Clicker ${RELEASE_TAG}"
